<!doctype html>
<html lang="en-US">
  <head>
    <!--universal character set that includes pretty much any character-->
    <meta charset="utf-8" />
    <!-- helps webpages adapt to mobile devices and different screen widths-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--SEO tags -->
    <!--name of the author or creator of the HTML document-->
    <meta name="author" content="Yingi Chiqinda" />
    <!--a brief summary of the webpage-->
    <meta
      name="description"
      content="Learn the fundamentals for builiding responsive UIs using HTML, SCSS, and CSS."
    />
    <!--a brief summary of the webpage-->
    <meta name="keywords" content="HTML, CSS, web development, tutorial" />
    <!-- provides instructions to search engine crawlers -->
    <meta name="robots" content="index, follow" />
    <!-- requests a page refresh every 30 seconds -->
    <!-- <meta http-equiv="refresh" content="30" /> -->

    <!-- Open Graph / Social sharing tags -->
    <meta property="og:title" content="Frontend Developer Portfolio" />

    <meta
      property="og:description"
      content="Explore my frontend development projects, skills, and portfolio."
    />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://example.com/portfolio" />

    <meta
      property="og:image"
      content="https://example.com/images/social-preview.jpg"
    />

    <meta
      property="og:image:alt"
      content="Preview of my frontend developer portfolio"
    />

    <meta property="og:site_name" content="My Portfolio" />

    <meta property="og:locale" content="en_ZA" />

    <!-- page title - on the browser -->
    <title>y-Stacs - Contact Us</title>
    <!-- Favicon -->
    <link rel="icon" href="../assets/images/favicon.ico" />
    <!-- External stylesheet -->
    <link rel="stylesheet" href="../css/main.css" />

    <!-- Bootstrap Icons stylesheet -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <!-- External js file -->
    <script src="../js/masterpage-layouts-loader.js" defer></script>
  </head>

  <body>
    <!-- 
        page-header
        include header layout 
    -->
    <div data-include="layouts/header.html"></div>
    <!-- 
        hero section
        include hero layout 
    -->
    <div data-include="layouts/hero.html"></div>

    <!-- page main-content -->
    <main class="contact-main-comtainer" id="contact-main-comtainer">
      <!-- page section -->
      <section class="contact-form-section">
        <secion class="section-heading">
          <h3>contact form</h3>
        </secion>

        <div class="contact-form-container">

          <form class="contact-form" action="#" method="post">
            
            <div class="form-group">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="subject">Subject</label>
              <input
                type="text"
                id="subject"
                name="subject"
                placeholder="What is your enquiry about?"
                required
              />
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Write your message here..."
                required
              ></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit" class="contact-button">submit</button> 
                <button type="reset" class="contact-button clear">clear</button>

            </div>
          
          </form>
        </div>
      </section>
    </main>

    <!-- 
        page-footer
        include footer layout 
    -->
    <div data-include="layouts/footer.html"></div>

    <!-- for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
